<div class="login-container">
  <div class="card">
    <h2>Login to Zerodha</h2>
    
    <!-- Login Form -->
     @if(!show2FA){
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="userId">User ID</label>
        <input 
          id="userId" 
          type="text" 
          formControlName="userId" 
          placeholder="Enter your user ID"
          [class.is-invalid]="loginForm.get('userId')?.invalid && loginForm.get('userId')?.touched"
        >
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Enter your password"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
      </div>
      @if(loginError){
      <div class="error-message">
        {{ loginError }}
      </div>
      }

      <button type="submit" [disabled]="loginForm.invalid || loading" class="login-button">
        @if(!loading){
        <span>Login</span>
        } @else {
        <span>Logging in...</span>
        }
      </button>
    </form>
    }
    <!-- 2FA Form -->
     @if(show2FA){
    <form [formGroup]="twoFAForm" (ngSubmit)="onVerify2FA()">
      <div class="form-group">
        <label for="twoFACode">Enter 2FA Code</label>
        <input 
          id="twoFACode" 
          type="text" 
          formControlName="twoFACode" 
          placeholder="Enter 6-digit code from authenticator app"
          maxlength="6"
          [class.is-invalid]="twoFAForm.get('twoFACode')?.invalid && twoFAForm.get('twoFACode')?.touched"
        >
      </div>

      @if(loginError){
      <div class="error-message">
        {{ loginError }}
      </div>
      }

      <button type="submit" [disabled]="twoFAForm.invalid || loading" class="login-button">
        @if(!loading){
        <span>Verify</span>
        } @else {
        <span>Verifying...</span>
        }
      </button>
    </form>
    }
  </div>
</div>
